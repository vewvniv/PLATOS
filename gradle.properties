org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dapi.version=1.44

# O docker-java embutido no Testcontainers 1.21.x fala a API 1.32 por padrao, e o Docker Engine 29
# recusa qualquer cliente abaixo de 1.40. `api.version` fixa a versao que o cliente anuncia; 1.44 e
# suportada por engines a partir do Docker 24. Vale para o daemon do Gradle (codegen jOOQ) e e
# repetida em `apps/api/build.gradle.kts` para a JVM forkada dos testes.
dockerApiVersion=1.44

# AndroidX e obrigatorio a partir do AGP 8; as bibliotecas de teste instrumentado do Android
# so existem sob esse namespace.
android.useAndroidX=true
