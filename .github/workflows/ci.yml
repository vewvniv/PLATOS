name: CI

on:
  push:
    branches: [main]
  pull_request:

# A `concurrency` e declarada por job, e nao no workflow. No workflow, um push novo cancelava a
# execucao em curso inteira — `paridade` incluida — e foi assim que ela caiu na PR #30, com passo
# marcado como falha sem erro no log, custando horas (P15). `build` e `web` continuam sendo
# cancelados, porque sao rapidos e o commit novo os refaz; `paridade` nao, porque e o job mais caro de
# perder e o que o §16 chama de maior risco do projeto se nao existir. O grupo carrega o nome do job:
# com um grupo so, `build` e `web` da MESMA execucao disputariam o grupo, e um cancelaria o outro.
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    # Configuracao do aplicativo Android (tarefa 2.2 da fatia 4a-zero). Ausente, o build falha de
    # proposito: aplicativo sem destino nao serve para nada, e string vazia so quebraria na primeira
    # chamada de rede, com erro que fala de rede e nao de configuracao.
    #
    # Os valores aqui sao **marcadores**, e nao o projeto de verdade. O CI nao fala com o Supabase:
    # o probe que falaria e pulado por nao ter `probe.supabaseUrl`, e nenhuma tela alcanca a rede
    # ainda. O host `.invalido` e reservado justamente para nao resolver, entao se algum dia algo
    # aqui tentar sair para a rede, a falha e imediata em vez de acertar um servidor por engano.
    env:
      PLATOS_SUPABASE_URL: https://ci.invalido
      PLATOS_SUPABASE_ANON_KEY: chave-de-marcador-do-ci-sem-projeto
      PLATOS_API_URL: https://ci.invalido

    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      # `./gradlew build` nao alcanca teste de buildSrc: medido em 2026-09-18 com uma sonda que
      # chama `fail()` por construcao — o build ficou verde e `:buildSrc:` parou em `jar`. Sem este
      # passo, a guarda de `conectarAoPostgres` existiria sem nunca rodar, que e a forma mais cara de
      # teste: a que da confianca sem dar sinal.
      #
      # Vem antes do codegen de proposito. Os dois usam a mesma aquisicao de conexao, e se ela
      # quebrar e melhor o vermelho sair do teste que nomeia o defeito do que do passo que so diz
      # que o codegen falhou.
      - name: Teste do buildSrc
        run: ./gradlew -p buildSrc test

      # Sobe Postgres efemero, aplica supabase/migrations em ordem e gera as classes tipadas
      # (D-0.7). Divergencia entre migration e codigo quebra o build aqui, nao em producao.
      - name: Codegen jOOQ
        run: ./gradlew :apps:api:generateJooq

      # Os testes de isolamento rodam contra Postgres real, conectados como app_backend — papel
      # sem SUPERUSER e sem BYPASSRLS (D-0.2). Rodar como superusuario deixaria a suite verde sem
      # provar nada, entao ConnectionRoleTest falha o build nesse caso.
      #
      # A partir da fatia 1 isto tambem roda `packages/domain` nos tres alvos: e o alvo JS que
      # prova que a medicao de texto nao divergiu (D-1.2, D-1.6).
      - name: Build e testes
        run: ./gradlew build

      # A redacao original dizia que `build` **nao** alcanca o teste de host do alvo Android do
      # modulo KMP, e que por isso ele e pedido pelo nome. Ela fica registrada porque o incidente
      # que a motivou e real: entre a subida para AGP 9 e a fatia 1.5, "o mesmo valor afirmado em
      # tres runtimes" valeu em dois, calado.
      #
      # **Medido em 2026-09-18, e hoje ela esta errada.** O log de `./gradlew build --rerun-tasks`
      # traz `:packages:domain:testAndroidHostTest` executando, via `allTests`. Entao este passo e
      # **redundante**, e nao a unica cobertura daquele alvo.
      #
      # Ele fica assim mesmo, e a escolha e deliberada: remove-lo se apoiaria numa **unica**
      # medicao de uma propriedade que ja mudou sozinha uma vez, e o custo dele e segundos. Um
      # passo redundante que roda e mais barato que um alvo que para de ser coberto em silencio.
      - name: Testes do alvo Android do dominio
        run: ./gradlew :packages:domain:testAndroidHostTest

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-de-testes
          path: |
            apps/api/build/reports/tests/test
            packages/domain/build/reports/tests
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-web
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # D-1.5.2/D-1.5.8: a conversao de formula e ferramenta de build. O `--check` nao escreve nada
      # e falha se o raster ou o manifesto versionados nao forem o que a conversao produz hoje —
      # uma troca de versao de MathJax ou de resvg que mexesse no tracado sem mexer na dimensao
      # passaria pelo golden do `LayoutMap` sem um ruido.
      - name: Instalar a conversao de formula
        working-directory: tools/math
        run: npm ci

      - name: Testes da conversao de formula
        working-directory: tools/math
        run: npm test

      - name: Conversao de formula esta em dia
        working-directory: tools/math
        run: node build.mjs --check

      - name: Instalar dependencias do web
        working-directory: apps/web
        run: npm ci

      - name: Testes do renderizador web
        working-directory: apps/web
        run: npm test

      - name: Build do web
        working-directory: apps/web
        run: npm run build

      # O PDF do lado web e insumo do job de paridade.
      - name: Gerar PDF da fixture
        working-directory: apps/web
        run: npx tsx scripts/render-fixture.ts

      # ADR-0001: fidelidade dimensional e propriedade do documento, medida a 1200 dpi com
      # tolerancia de 0,05 mm. Medir no papel mediria a impressora — tres delas reescalaram a
      # mesma folha entre -3,4% e +4,7%, em direcoes opostas, com escala declarada em 100%.
      - name: Instalar o medidor
        working-directory: tools/parity
        run: npm ci

      - name: Fidelidade dimensional do documento
        working-directory: tools/parity
        run: node fidelidade.mjs ../../build/parity/web.pdf ../../fixtures/prova-referencia.layout.json

      # D-2b.7: a folha que reprova uma impressora sai do mesmo caminho da prova, e e medida pelas
      # mesmas ferramentas. Uma folha de teste desenhada por fora nao aprovaria nada.
      - name: Gerar a folha de teste de impressao
        working-directory: apps/web
        run: npx tsx scripts/render-test-sheet.ts

      - name: Fidelidade dimensional da folha de teste
        working-directory: tools/parity
        run: node fidelidade.mjs ../../build/parity/teste-web.pdf ../../fixtures/folha-de-teste.layout.json

      # ADR-0010: tinta decorativa dentro da bolha, teto de trama e monocromia, medidos sobre o
      # documento. Nenhum dos tres tem oracle no mapa — o que o OMR le e tinta.
      - name: Tinta do documento da prova
        working-directory: tools/parity
        run: node tinta.mjs ../../build/parity/web.pdf ../../fixtures/prova-referencia.layout.json

      - name: Tinta da folha de teste
        working-directory: tools/parity
        run: node tinta.mjs ../../build/parity/teste-web.pdf ../../fixtures/folha-de-teste.layout.json

      # Os defeitos de tinta nao quebram golden, fidelidade nem paridade: eles chegariam ao papel
      # com a suite inteira no verde. Por isso a medicao precisa ser vista falhando a cada CI.
      - name: A medicao de tinta continua capaz de falhar
        run: |
          cd apps/web && npx tsx scripts/render-inked.ts
          cd ../../tools/parity
          for defeito in tinta-faixa tinta-cor; do
            if node tinta.mjs ../../build/parity/$defeito.pdf \
                 ../../fixtures/prova-referencia.layout.json; then
              echo "::error::a medicao de tinta aceitou o defeito deliberado $defeito"
              exit 1
            fi
          done
          echo "a medicao de tinta acusou os dois defeitos, como deve"

      # O limiar do OMR aparece em tres registros que nao se conhecem: a constante do aplicativo, o
      # ADR-0011 e o corredor que cada folha declara. Divergir entre eles nao quebra teste nenhum —
      # compila, o golden nao muda, o hash do pacote continua igual, e a folha segue sendo lida com
      # o numero errado. Mesma familia da medicao de tinta, e por isso tambem vista falhar a cada CI.
      - name: O limiar do OMR concorda nos tres registros
        run: node tools/parity/limiar.mjs

      - name: A verificacao do limiar continua capaz de falhar
        run: |
          if node tools/parity/limiar.mjs --esperado 450 > /dev/null 2>&1; then
            echo "::error::a verificacao do limiar aceitou 450, fora do corredor de ADR-0010"
            exit 1
          fi
          echo "a verificacao do limiar acusou o numero fora do corredor, como deve"

      # Mesma familia, outro valor: os quatro `answer_kind` vivem no dominio KMP e no `check` da
      # migration. O ADR-0015 uniu as duas copias Kotlin e deixou o `check` de proposito — guarda de
      # banco gerada por quem escreve as linhas nao e guarda. Divergir entre os dois nao quebra
      # teste nenhum: o Kotlin compila, os testes de literal passam (eles afirmam o que o aparelho
      # ENVIA, nao o que o banco ACEITA), e o desencontro so aparece como `violates check
      # constraint` num INSERT em producao — depois de a folha ja ter sido corrigida.
      - name: Os valores de answer_kind concordam com o check da migration
        run: node tools/parity/answer-kind.mjs

      - name: A verificacao de answer_kind continua capaz de falhar
        run: |
          if node tools/parity/answer-kind.mjs \
               --esperado marcada,em_branco,multipla_marcacao,rasurada > /dev/null 2>&1; then
            echo "::error::a verificacao de answer_kind aceitou 'rasurada', que o check nao admite"
            exit 1
          fi
          echo "a verificacao de answer_kind acusou o valor que o check nao admite, como deve"

      # O contrato de transporte tem um declarante (ADR-0015), e o que prende o nome de um campo e
      # um JSON com esse nome digitado nos DOIS lados. Teste que desserializa o corpo com o proprio
      # tipo nao prende nada: a rota escreve "nome", o teste le "nome", e o verde continua. Foi
      # assim que organizacao e prova ficaram presas so do lado do aparelho, e so a mutacao mostrou
      # (docs/cobertura-o-fio-preso-nos-dois-lados.md). A guarda le todo tipo @Serializable de
      # com.platos.domain.transport da fonte e reprova o que nao tem literal nos dois lados — antes
      # de a fatia 5 escrever o primeiro. Ela prova que o literal existe, e nao que ele prende o
      # fio: isso so a mutacao de @SerialName prova.
      - name: O fio de cada contrato esta preso nos dois lados
        run: node tools/parity/fio.mjs

      # Os dois defeitos sao plantados FORA do checkout: um contrato a mais, sem literal em lado
      # nenhum, numa copia temporaria de transport/; e um diretorio vazio. O motivo e conferido, e
      # nao so o codigo de saida — recusar pelo motivo errado seria a camada vizinha segurando.
      - name: A verificacao do fio continua capaz de falhar
        run: |
          fantasma="$(mktemp -d)"
          cp -r packages/domain/src/commonMain/kotlin/com/platos/domain/transport/. "$fantasma/"
          printf '%s\n' \
            'package com.platos.domain.transport' '' \
            'import kotlinx.serialization.SerialName' \
            'import kotlinx.serialization.Serializable' '' \
            '@Serializable' \
            'data class FantasmaDto(@SerialName("campo_fantasma") val campoFantasma: String)' \
            > "$fantasma/FantasmaDto.kt"
          codigo=0; saida="$(node tools/parity/fio.mjs --transport "$fantasma" 2>&1)" || codigo=$?
          for lado in servidor aparelho; do
            if [ "$codigo" -ne 1 ] \
               || ! grep -q "FantasmaDto (.*) nao tem literal escrito a mao do lado do $lado" <<<"$saida"; then
              echo "$saida"
              echo "::error::a verificacao do fio nao acusou o contrato sem literal do lado do $lado (saida $codigo)"
              exit 1
            fi
          done
          vazio="$(mktemp -d)"
          codigo=0; saida="$(node tools/parity/fio.mjs --transport "$vazio" 2>&1)" || codigo=$?
          if [ "$codigo" -ne 2 ] || ! grep -q "piso:" <<<"$saida"; then
            echo "$saida"
            echo "::error::a verificacao do fio aceitou uma raiz de contratos vazia (saida $codigo)"
            exit 1
          fi
          echo "a verificacao do fio acusou o contrato sem literal nos dois lados, e o piso, como deve"

      # A versao do renderizador (D24) aparece em tres registros que nao se conhecem: o MIN que a
      # publicacao escreve no mapa, e a versao de cada renderizador, Android e web. A direcao
      # silenciosa e a pior: um renderizador que sobe a propria constante sem o mapa subir MIN faz
      # cliente antigo desenhar mapa novo, e nenhum teste cai — medido, 14 de 14 no web e 308 de 308
      # no Android (docs/cobertura-versao-do-renderizador-conferida.md). Mesma familia do limiar. A
      # verificacao prova que os tres numeros concordam, e nao que estao certos.
      - name: A versao do renderizador concorda nos tres registros
        run: node tools/parity/renderizador.mjs

      # Cada registro e forcado sozinho, um de cada vez: forcar so um provaria so esse, e uma
      # comparacao que deixasse de incluir um dos tres passaria. O motivo e conferido — os dois pares
      # que contem o registro forcado, e so eles —, e nao so o codigo de saida. Este passo prova a
      # comparacao, e nao a leitura dos arquivos: essa foi vista falhar por mutacao na mudanca que o
      # criou, e daqui em diante e protegida pela falha fechada (saida 2) do proprio script.
      - name: A verificacao da versao do renderizador continua capaz de falhar
        run: |
          for forcado in dominio android web; do
            codigo=0; saida="$(node tools/parity/renderizador.mjs --divergir "$forcado" 2>&1)" || codigo=$?
            erro=""
            if [ "$codigo" -ne 1 ]; then erro="saida $codigo, e nao 1"; fi
            for par in "dominio android" "dominio web" "android web"; do
              set -- $par
              linha="os registros $1 e $2 discordam"
              if [ "$1" = "$forcado" ] || [ "$2" = "$forcado" ]; then
                grep -q "$linha" <<<"$saida" || erro="$erro; faltou '$linha'"
              elif grep -q "$linha" <<<"$saida"; then
                erro="$erro; sobrou '$linha'"
              fi
            done
            if [ -n "$erro" ]; then
              echo "$saida"
              echo "::error::a verificacao da versao do renderizador, com $forcado forcado: ${erro#; }"
              exit 1
            fi
          done
          echo "a verificacao da versao do renderizador acusou cada registro forcado, e so os pares dele, como deve"

      # As tres fixtures derivadas da digitalizacao — o vetor de referencia e o recorte retificado
      # — sao geradas por ferramenta e versionadas. Nada as verificava: se a imagem e o vetor
      # deixassem de corresponder, os testes do OMR continuariam verdes comparando com uma
      # referencia que nao descreve mais a folha. Mesmo padrao de "conversao de formula esta em
      # dia", acima.
      - name: As fixtures da digitalizacao estao em dia
        working-directory: tools/parity
        run: |
          node papel.mjs ../../fixtures/prova-referencia.digitalizacao.jpg                ../../fixtures/prova-referencia.layout.json --json /tmp/prova.papel.json > /dev/null
          node papel.mjs ../../fixtures/folha-de-teste.digitalizacao.jpg                ../../fixtures/folha-de-teste.layout.json --json /tmp/teste.papel.json > /dev/null
          node recorte.mjs ../../fixtures/prova-referencia.digitalizacao.jpg                ../../fixtures/prova-referencia.layout.json /tmp/prova.recorte.pgm > /dev/null
          diff -u ../../fixtures/prova-referencia.papel.json /tmp/prova.papel.json
          diff -u ../../fixtures/folha-de-teste.papel.json /tmp/teste.papel.json
          cmp ../../fixtures/prova-referencia.recorte.pgm /tmp/prova.recorte.pgm
          echo "as fixtures derivadas batem com a digitalizacao versionada"

      - uses: actions/upload-artifact@v7
        with:
          name: pdf-web
          path: |
            build/parity/web.pdf
            build/parity/teste-web.pdf
            build/parity/tinta-sem-faixa.pdf

  # §16: "se o teste de paridade nao existir, vira o maior risco do projeto". Fica em job separado
  # porque o emulador domina o tempo do pipeline, e nao deve atrasar o retorno do build do servidor.
  paridade:
    runs-on: ubuntu-latest
    needs: web
    # Sem cancelar: a execucao nova espera esta terminar. Se o `web` desta execucao for cancelado
    # antes de acabar, a `paridade` dela nao chega a comecar — e a da execucao nova cobre o commit novo.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-paridade
      cancel-in-progress: false
    # Configuracao do aplicativo Android (tarefa 2.2 da fatia 4a-zero). Ausente, o build falha de
    # proposito: aplicativo sem destino nao serve para nada, e string vazia so quebraria na primeira
    # chamada de rede, com erro que fala de rede e nao de configuracao.
    #
    # Os valores aqui sao **marcadores**, e nao o projeto de verdade. O CI nao fala com o Supabase:
    # o probe que falaria e pulado por nao ter `probe.supabaseUrl`, e nenhuma tela alcanca a rede
    # ainda. O host `.invalido` e reservado justamente para nao resolver, entao se algum dia algo
    # aqui tentar sair para a rede, a falha e imediata em vez de acertar um servidor por engano.
    env:
      PLATOS_SUPABASE_URL: https://ci.invalido
      PLATOS_SUPABASE_ANON_KEY: chave-de-marcador-do-ci-sem-projeto
      PLATOS_API_URL: https://ci.invalido

    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Baixar PDFs do web
        uses: actions/download-artifact@v8
        with:
          name: pdf-web
          path: build/parity

      # O runner chega com ~4 GB livres e o emulador exige 7,4 GB so para a particao de dados,
      # entao ele morre no arranque e o `adb` fica dez minutos procurando um dispositivo que nunca
      # existiu. Nada do que e removido aqui participa deste build.
      - name: Liberar espaco em disco
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /opt/ghc \
                      /usr/local/share/powershell
          df -h / | tail -1

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Dois grupos de teste rodam aqui, e os dois precisam da plataforma de verdade. O
      # renderizador gera o PDF pelo `PdfDocument` real do Android — um duble nao provaria nada. E
      # a captura da fatia 3a usa OpenCV e ZXing-C++, que sao nativos e so existem no aparelho
      # (§13): deteccao de ArUco, homografia, retificacao e decodificacao do QR.
      - name: Renderizador e captura no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          # O padrao pede 7,4 GB. Subiu de 4 GB para 6 quando a fatia 3a entrou: o APK de debug
          # passou a carregar os `.so` do OpenCV nas quatro ABIs, e sozinho da 143 MB.
          disk-size: 6144M
          disable-animations: true
          script: ./gradlew :apps:android:connectedDebugAndroidTest

      # O AGP desinstala os APKs ao fim da execucao, entao nao adianta puxar de `filesDir` depois:
      # o diretorio vai junto. O teste grava no `additionalTestOutputDir`, que o proprio AGP
      # recolhe para `build/outputs/` antes de desinstalar.
      - name: Recolher os PDFs do Android
        run: |
          mkdir -p build/parity
          for nome in android.pdf android-teste.pdf; do
            find apps/android/build/outputs/connected_android_test_additional_output \
              -name $nome -exec cp {} build/parity/$nome \;
            test -s build/parity/$nome
          done

      - name: Instalar o comparador
        working-directory: tools/parity
        run: npm ci

      # Os dois PDFs sao rasterizados aqui, pelo mesmo rasterizador (D-1.7). Se cada plataforma
      # rasterizasse a sua, o teste mediria diferenca de rasterizador, nao de renderizador.
      - name: Fidelidade dimensional do documento do Android
        working-directory: tools/parity
        run: node fidelidade.mjs ../../build/parity/android.pdf ../../fixtures/prova-referencia.layout.json

      - name: Comparar centroides com tolerancia de 0,3 mm
        working-directory: tools/parity
        run: node compare.mjs ../../build/parity/web.pdf ../../build/parity/android.pdf ../../fixtures/prova-referencia.layout.json

      # A folha de teste passa pelas mesmas guardas da prova. Sem isto, o unico documento do
      # projeto que ninguem compara entre plataformas seria justamente o que **aprova uma
      # impressora** — e o professor aprovaria por uma folha e imprimiria outra.
      - name: Fidelidade da folha de teste no Android
        working-directory: tools/parity
        run: node fidelidade.mjs ../../build/parity/android-teste.pdf ../../fixtures/folha-de-teste.layout.json

      - name: Paridade da folha de teste
        working-directory: tools/parity
        run: node compare.mjs ../../build/parity/teste-web.pdf ../../build/parity/android-teste.pdf ../../fixtures/folha-de-teste.layout.json

      - name: Tinta dos documentos do Android
        working-directory: tools/parity
        run: |
          node tinta.mjs ../../build/parity/android.pdf ../../fixtures/prova-referencia.layout.json
          node tinta.mjs ../../build/parity/android-teste.pdf ../../fixtures/folha-de-teste.layout.json

      # A faixa ausente e o defeito que o Android carregou desde a fatia 1 sem ninguem ver: ele nao
      # move centroide nenhum. Quem o pega e a comparacao de trama, e so ela.
      - name: A paridade enxerga trama, e nao so posicao
        working-directory: tools/parity
        run: |
          if node compare.mjs ../../build/parity/web.pdf ../../build/parity/tinta-sem-faixa.pdf \
               ../../fixtures/prova-referencia.layout.json; then
            echo "::error::a paridade aceitou um documento sem as faixas do gabarito"
            exit 1
          fi
          echo "a paridade acusou a faixa ausente, como deve"

      # Uma verificacao que nunca falha e pior que nenhuma, e esta base ja produziu tres: uma
      # janela que alcancava o vizinho, um `NaN` que passava em qualquer tolerancia, e uma janela
      # justa que recortava a propria formula deslocada e lia 0,5 mm como 0,142 mm. Deslocar de
      # proposito e conferir que as duas ferramentas acusam custa segundos.
      - name: Instalar o gerador do deslocamento deliberado
        working-directory: apps/web
        run: npm ci

      - name: A verificacao continua capaz de falhar
        working-directory: apps/web
        run: |
          npx tsx scripts/render-shifted.ts
          cd ../../tools/parity
          if node compare.mjs ../../build/parity/web.pdf ../../build/parity/shifted.pdf \
               ../../fixtures/prova-referencia.layout.json; then
            echo "::error::a paridade aceitou um deslocamento deliberado de 0,5 mm"
            exit 1
          fi
          if node fidelidade.mjs ../../build/parity/shifted.pdf \
               ../../fixtures/prova-referencia.layout.json; then
            echo "::error::a fidelidade aceitou um deslocamento deliberado de 0,5 mm"
            exit 1
          fi
          echo "as duas ferramentas acusaram o deslocamento, como devem"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdfs-de-paridade
          path: build/parity/*.pdf
          if-no-files-found: ignore
