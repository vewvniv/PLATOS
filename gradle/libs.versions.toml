[versions]
kotlin = "2.4.10"
agp = "9.3.1"
# 3.2.1, e nao 3.2.0: `ktor-client-core-jvm` 3.2.0 **nao passa pelo D8**. Ele tem um campo chamado
# `use streaming syntax` — com espacos — em `io.ktor.client.plugins.Messages`, e nome com espaco e
# ilegal em DEX abaixo da versao 040. O sintoma e `Error while dexing`, na montagem do APK, e nao na
# compilacao. Bug do Ktor, corrigido no primeiro patch; 3.2.1 e o menor salto que dexa.
# Uma versao so para servidor e aparelho e o que a decisao 2 pede, e por isso o servidor sobe junto.
ktor = "3.2.1"
jooq = "3.20.3"
kotlinx-serialization = "1.8.1"
kaml = "0.83.0"
hikari = "6.3.0"
postgresql = "42.7.7"
testcontainers = "1.21.3"
junit = "5.12.2"
androidx-test = "1.6.2"
androidx-test-junit = "1.2.1"
opencv = "4.11.0"
zxingcpp = "2.3.0"
logback = "1.5.18"
# Interface e camera (§13). Entram na fatia 3c, que e quando o modulo Android deixa de ser
# biblioteca e vira aplicativo.
compose-bom = "2025.01.00"
activity-compose = "1.10.0"
lifecycle = "2.8.7"
camerax = "1.4.1"
# Fatia 4a-zero, decisao 5: a credencial cifrada em repouso, com chave no Android Keystore.
security-crypto = "1.1.0"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }

jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
jooq-meta = { module = "org.jooq:jooq-meta", version.ref = "jooq" }

hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

# Captura (§13). OpenCV faz ArUco e homografia; ZXing-C++ decodifica o QR sobre a ROI retificada.
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
zxingcpp = { module = "io.github.zxing-cpp:android", version.ref = "zxingcpp" }

# Interface e camera (§13, fatia 3c).
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }

# Cliente HTTP do aparelho (fatia 4a-zero, tarefa 2.1). Mesma versao do Ktor do servidor: a
# decisao 2 pede **uma** pilha HTTP no projeto, e `version.ref = "ktor"` e o que impede as duas
# pontas de divergirem sem ninguem perceber. OkHttp e o engine porque e o que existe no Android.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
